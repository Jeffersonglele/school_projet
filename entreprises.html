<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCHOOL — Entreprises</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg-0: #0B0C0E;
    --bg-1: #111318;
    --bg-2: #15171B;
    --border: #1E2024;
    --border-strong: #24262B;

    --text-primary: #F2EDE4;
    --text-secondary: #8A8D93;
    --text-muted: #6B6E74;
    --text-faint: #4A4C51;

    --gold: #C9930A;
    --gold-dim: rgba(201, 147, 10, 0.14);
    --on-gold: #1A1300;

    --good: #97C459;
    --good-bg: rgba(99, 153, 34, 0.12);
    --danger: #E24B4A;
    --danger-bg: rgba(226, 75, 74, 0.12);

    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- Topbar ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-1);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-left { display: flex; align-items: center; gap: 22px; }

  .topbar-brand { display: flex; align-items: baseline; gap: 10px; }
  .topbar-brand span.mark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 3px;
  }
  .topbar-brand span.sep {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--gold); display: inline-block;
  }
  .topbar-brand span.section {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
  }

  .back-link {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .back-link:hover { color: var(--text-primary); }

  .topbar-user { display: flex; align-items: center; gap: 14px; }
  .user-chip {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 12px 6px 6px;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: 30px;
  }
  .user-chip .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--gold-dim); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 12px;
  }
  .user-chip .name { font-size: 12.5px; color: var(--text-primary); }
  .user-chip .role {
    font-size: 10px; color: var(--gold);
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  .btn-icon {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-2);
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .btn-icon:hover { color: var(--danger); border-color: var(--danger); }

  /* ---------- Layout ---------- */

  .page { max-width: 1180px; margin: 0 auto; padding: 40px 32px 80px; }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .page-head p.eyebrow {
    font-size: 11.5px; color: var(--gold);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin: 0 0 8px;
  }
  .page-head h1 {
    font-family: var(--font-display);
    font-weight: 600; font-size: 32px;
    margin: 0 0 6px;
  }
  .page-head p.sub { font-size: 13.5px; color: var(--text-secondary); margin: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500;
    padding: 11px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-primary { background: var(--gold); color: var(--on-gold); }
  .btn-primary:hover { background: #DBA31A; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
  }
  .btn-secondary:hover { border-color: var(--text-muted); }
  .btn-ghost-danger {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--danger);
  }
  .btn-ghost-danger:hover { border-color: var(--danger); background: var(--danger-bg); }
  .btn-ghost-good {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--good);
  }
  .btn-ghost-good:hover { border-color: var(--good); background: var(--good-bg); }
  .btn-block { width: 100%; justify-content: center; }

  .status-banner {
    margin-top: 20px;
    font-size: 12.5px;
    padding: 10px 14px;
    border-radius: 6px;
    display: none;
    background: var(--danger-bg);
    color: var(--danger);
  }
  .status-banner.visible { display: block; }
  .status-banner.success { background: var(--good-bg); color: var(--good); }

  /* ---------- Toolbar ---------- */

  .toolbar {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 220px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-1);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .search-box:focus-within { border-color: var(--gold); }
  .search-box i { color: var(--text-muted); font-size: 15px; }
  .search-box input {
    border: none; background: transparent; outline: none;
    color: var(--text-primary); font-size: 13px; width: 100%;
    font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-faint); }

  .status-filter {
    background: var(--bg-1);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text-primary);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
  }
  .status-filter:focus { border-color: var(--gold); }

  /* ---------- Table ---------- */

  .table-wrap {
    margin-top: 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-1);
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    text-align: left;
    font-size: 10.5px;
    color: var(--text-muted);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg-2); }
  tbody tr.inactive { opacity: 0.5; }

  td {
    padding: 14px 20px;
    font-size: 13px;
    vertical-align: middle;
  }

  td.name-cell { display: flex; align-items: center; gap: 10px; }
  td.name-cell .avatar-sm {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--gold-dim); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; flex-shrink: 0;
  }
  td.name-cell .col { display: flex; flex-direction: column; gap: 2px; }
  td.name-cell .fullname { color: var(--text-primary); }
  td.name-cell .responsable { color: var(--text-faint); font-size: 11.5px; }

  td.contact-cell { color: var(--text-secondary); font-size: 12.5px; }
  td.contact-cell div + div { margin-top: 2px; }
  td.contact-cell .muted { color: var(--text-faint); }

  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    display: inline-block;
    font-size: 10.5px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .pill.active { background: var(--good-bg); color: var(--good); }
  .pill.inactive { background: var(--danger-bg); color: var(--danger); }
  .pill.valide { background: var(--gold-dim); color: var(--gold); }
  .pill.non-valide { background: rgba(138, 141, 147, 0.14); color: var(--text-secondary); }
  .pill.visite { background: rgba(138, 141, 147, 0.14); color: var(--text-secondary); }

  td.meta { color: var(--text-faint); font-family: var(--font-mono); font-size: 11.5px; }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .row-actions button {
    width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--bg-2);
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 13px;
  }
  .row-actions button:hover { color: var(--gold); border-color: var(--gold); }
  .row-actions button.danger:hover { color: var(--danger); border-color: var(--danger); }
  .row-actions button.good:hover { color: var(--good); border-color: var(--good); }

  .empty-state, .loading-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12.5px;
  }

  /* ---------- Modal ---------- */

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(11, 12, 14, 0.7);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
    overflow-y: auto;
  }
  .modal-overlay.visible { display: flex; }

  .modal-card {
    width: 100%; max-width: 460px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 26px 24px;
    margin: auto;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-head h2 {
    font-family: var(--font-display);
    font-weight: 600; font-size: 21px; margin: 0;
  }
  .modal-close {
    width: 28px; height: 28px; border-radius: 6px;
    border: none; background: transparent;
    color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .modal-close:hover { color: var(--text-primary); }

  .modal-banner {
    font-size: 12.5px; padding: 9px 12px; border-radius: 6px;
    margin-bottom: 16px; display: none;
    background: var(--danger-bg); color: var(--danger);
  }
  .modal-banner.visible { display: block; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
  }

  .field-group { margin-bottom: 16px; }
  .field-group label {
    display: block; font-size: 11.5px; color: var(--text-secondary);
    margin-bottom: 7px; letter-spacing: 0.3px;
  }
  .input-icon {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 10px 12px;
  }
  .input-icon:focus-within { border-color: var(--gold); }
  .input-icon i { font-size: 15px; color: var(--text-muted); flex-shrink: 0; }
  .input-icon input, .input-icon select {
    border: none; background: transparent; outline: none;
    color: var(--text-primary); font-size: 13px; width: 100%;
    font-family: inherit;
  }
  .input-icon input::placeholder { color: var(--text-faint); }

  .field-error {
    font-size: 11.5px; color: var(--danger);
    margin-top: 5px; display: none;
  }
  .field-error.visible { display: block; }

  .check-row {
    display: flex;
    gap: 20px;
    margin-bottom: 18px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .check-item input {
    accent-color: var(--gold);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .fieldset-label {
    font-size: 10.5px;
    color: var(--text-muted);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin: 22px 0 14px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }
  .fieldset-label:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .btn { flex: 1; }

  @media (max-width: 640px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { padding: 14px 20px; }
    td { padding: 4px 0; border: none; }
    td.name-cell { padding: 4px 0 8px; }
    td.contact-cell div + div { margin-top: 2px; }
    .row-actions { justify-content: flex-start; margin-top: 8px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-brand">
      <span class="mark">SCHOOL</span>
      <span class="sep"></span>
      <span class="section">Entreprises</span>
    </div>
    <a class="back-link" href="dashboard.html">
      <i class="ti ti-arrow-left"></i> Tableau de bord
    </a>
  </div>
  <div class="topbar-user">
    <div class="user-chip">
      <span class="avatar" id="user-avatar">·</span>
      <span>
        <span class="name" id="user-name">—</span><br />
        <span class="role" id="user-role">—</span>
      </span>
    </div>
    <button class="btn-icon" id="logout-btn" title="Se déconnecter" aria-label="Se déconnecter">
      <i class="ti ti-logout"></i>
    </button>
  </div>
</div>

<div class="page">

  <div class="page-head">
    <div>
      <p class="eyebrow">Partenaires</p>
      <h1>Entreprises</h1>
      <p class="sub">Entreprises partenaires enregistrées dans la plateforme.</p>
    </div>
    <button class="btn btn-primary" id="open-create-btn">
      <i class="ti ti-plus"></i> Nouvelle entreprise
    </button>
  </div>

  <div class="status-banner" id="page-banner"></div>

  <div class="toolbar">
    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="search-input" placeholder="Rechercher une entreprise, un responsable…" />
    </div>
    <select class="status-filter" id="status-filter">
      <option value="">Tous les statuts</option>
      <option value="active">Actives</option>
      <option value="inactive">Inactives</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Entreprise</th>
          <th>Contact</th>
          <th>RCCM / IFU</th>
          <th>Statut</th>
          <th>Année</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="entreprises-tbody">
        <tr><td colspan="6"><div class="loading-state">Chargement…</div></td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- ---------- Modal : créer / modifier ---------- -->
<div class="modal-overlay" id="entreprise-modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="entreprise-modal-title">Nouvelle entreprise</h2>
      <button class="modal-close" id="entreprise-modal-close" aria-label="Fermer"><i class="ti ti-x"></i></button>
    </div>

    <div class="modal-banner" id="entreprise-modal-banner"></div>

    <form id="entreprise-form" novalidate>
      <input type="hidden" id="entreprise-id" />

      <div class="field-group">
        <label for="entreprise-nom">Nom de l'entreprise</label>
        <div class="input-icon">
          <i class="ti ti-building-skyscraper"></i>
          <input type="text" id="entreprise-nom" placeholder="Raison sociale" autocomplete="off" />
        </div>
        <div class="field-error" id="entreprise-nom-error">Le nom est requis.</div>
      </div>

      <div class="field-group">
        <label for="entreprise-responsable">Responsable</label>
        <div class="input-icon">
          <i class="ti ti-user"></i>
          <input type="text" id="entreprise-responsable" placeholder="Nom du responsable" autocomplete="off" />
        </div>
      </div>

      <div class="fieldset-label">Coordonnées</div>

      <div class="field-row">
        <div class="field-group">
          <label for="entreprise-telephone">Téléphone</label>
          <div class="input-icon">
            <i class="ti ti-phone"></i>
            <input type="text" id="entreprise-telephone" placeholder="+229 …" autocomplete="off" />
          </div>
        </div>
        <div class="field-group">
          <label for="entreprise-email">Email</label>
          <div class="input-icon">
            <i class="ti ti-mail"></i>
            <input type="email" id="entreprise-email" placeholder="contact@…" autocomplete="off" />
          </div>
        </div>
      </div>

      <div class="field-group">
        <label for="entreprise-adresse">Adresse</label>
        <div class="input-icon">
          <i class="ti ti-map-pin"></i>
          <input type="text" id="entreprise-adresse" placeholder="Adresse" autocomplete="off" />
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="entreprise-siteweb">Site web</label>
          <div class="input-icon">
            <i class="ti ti-world"></i>
            <input type="text" id="entreprise-siteweb" placeholder="https://…" autocomplete="off" />
          </div>
        </div>
        <div class="field-group">
          <label for="entreprise-facebook">Facebook</label>
          <div class="input-icon">
            <i class="ti ti-brand-facebook"></i>
            <input type="text" id="entreprise-facebook" placeholder="facebook.com/…" autocomplete="off" />
          </div>
        </div>
      </div>

      <div class="fieldset-label">Identification</div>

      <div class="field-row">
        <div class="field-group">
          <label for="entreprise-rccm">RCCM</label>
          <div class="input-icon">
            <i class="ti ti-file-text"></i>
            <input type="text" id="entreprise-rccm" placeholder="N° RCCM" autocomplete="off" />
          </div>
        </div>
        <div class="field-group">
          <label for="entreprise-ifu">IFU</label>
          <div class="input-icon">
            <i class="ti ti-id"></i>
            <input type="text" id="entreprise-ifu" placeholder="N° IFU" autocomplete="off" />
          </div>
        </div>
      </div>

      <div class="check-row">
        <label class="check-item">
          <input type="checkbox" id="entreprise-visite" />
          Visitée
        </label>
        <label class="check-item">
          <input type="checkbox" id="entreprise-valide" />
          Validée
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="entreprise-cancel-btn">Annuler</button>
        <button type="submit" class="btn btn-primary" id="entreprise-submit-btn">
          <span id="entreprise-submit-label">Créer</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ---------- Modal : confirmer activation / désactivation ---------- -->
<div class="modal-overlay" id="confirm-modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="confirm-modal-title">Confirmer</h2>
      <button class="modal-close" id="confirm-modal-close" aria-label="Fermer"><i class="ti ti-x"></i></button>
    </div>
    <p class="sub" id="confirm-modal-text" style="font-size:13px; color: var(--text-secondary); margin: 0 0 20px;"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="confirm-cancel-btn">Annuler</button>
      <button type="button" class="btn" id="confirm-ok-btn">Confirmer</button>
    </div>
  </div>
</div>

<script>
  const API_BASE_URL = "http://127.0.0.1:8000";

  const token = localStorage.getItem("school_token");
  const username = localStorage.getItem("school_username");
  const role = localStorage.getItem("school_role");

  function decodeJwtPayload(t) {
    try {
      const payload = t.split(".")[1];
      const normalized = payload.replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(decodeURIComponent(escape(atob(normalized))));
    } catch {
      return null;
    }
  }

  function isTokenValid(t) {
    const payload = decodeJwtPayload(t);
    if (!payload || !payload.exp) return false;
    return payload.exp * 1000 > Date.now();
  }

  if (!token || !isTokenValid(token)) {
    window.location.href = "login.html";
  }

  const isAdmin = role === "1";

  document.getElementById("user-name").textContent = username || "Utilisateur";
  document.getElementById("user-avatar").textContent = username ? username.charAt(0).toUpperCase() : "·";
  document.getElementById("user-role").textContent = isAdmin ? "Administrateur" : "Utilisateur";

  document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("school_token");
    localStorage.removeItem("school_username");
    localStorage.removeItem("school_role");
    window.location.href = "login.html";
  });

  function authHeaders(json = true) {
    const h = token ? { Authorization: `Bearer ${token}` } : {};
    if (json) h["Content-Type"] = "application/json";
    return h;
  }

  function showPageError(message) {
    const banner = document.getElementById("page-banner");
    banner.className = "status-banner visible";
    banner.textContent = message;
  }

  function showPageSuccess(message) {
    const banner = document.getElementById("page-banner");
    banner.className = "status-banner visible success";
    banner.textContent = message;
    setTimeout(() => banner.classList.remove("visible"), 3500);
  }

  async function apiRequest(path, options = {}) {
    let res;
    try {
      res = await fetch(`${API_BASE_URL}${path}`, options);
    } catch {
      throw new Error("Impossible de joindre le serveur.");
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}

    if (res.status === 401) {
      localStorage.removeItem("school_token");
      window.location.href = "login.html";
      throw new Error("Session expirée.");
    }

    if (!res.ok) {
      const detail = (data && (data.detail || data.message)) || `Erreur ${res.status}`;
      throw new Error(typeof detail === "string" ? detail : "Une erreur est survenue.");
    }
    return data;
  }

  // ---------- État ----------

  let allEntreprises = [];

  function initials(nom) {
    const words = (nom || "").trim().split(/\s+/).filter(Boolean);
    if (!words.length) return "?";
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0].charAt(0) + words[1].charAt(0)).toUpperCase();
  }

  // ---------- Rendu du tableau ----------

  function renderTable() {
    const tbody = document.getElementById("entreprises-tbody");
    const search = document.getElementById("search-input").value.trim().toLowerCase();
    const statusVal = document.getElementById("status-filter").value;

    let rows = allEntreprises;

    if (search) {
      rows = rows.filter((e) =>
        `${e.Nom} ${e.Responsable || ""}`.toLowerCase().includes(search)
      );
    }
    if (statusVal === "active") {
      rows = rows.filter((e) => e.Actif);
    } else if (statusVal === "inactive") {
      rows = rows.filter((e) => !e.Actif);
    }

    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">Aucune entreprise ne correspond.</div></td></tr>`;
      return;
    }

    tbody.innerHTML = rows
      .map((e) => {
        const contactLines = [];
        if (e.Telephone) contactLines.push(`<div>${e.Telephone}</div>`);
        if (e.Email) contactLines.push(`<div>${e.Email}</div>`);
        if (!contactLines.length) contactLines.push(`<div class="muted">—</div>`);

        const idLines = [];
        if (e.RCCM) idLines.push(e.RCCM);
        if (e.IFU) idLines.push(e.IFU);
        const idText = idLines.length ? idLines.join(" · ") : "—";

        const badges = [
          `<span class="pill ${e.Actif ? "active" : "inactive"}">${e.Actif ? "Active" : "Inactive"}</span>`,
        ];
        if (e.Valide) badges.push(`<span class="pill valide">Validée</span>`);
        if (e.Visite) badges.push(`<span class="pill visite">Visitée</span>`);

        return `
        <tr data-id="${e.IdEntreprise}" class="${e.Actif ? "" : "inactive"}">
          <td class="name-cell">
            <span class="avatar-sm">${initials(e.Nom)}</span>
            <span class="col">
              <span class="fullname">${e.Nom}</span>
              ${e.Responsable ? `<span class="responsable">${e.Responsable}</span>` : ""}
            </span>
          </td>
          <td class="contact-cell">${contactLines.join("")}</td>
          <td class="meta">${idText}</td>
          <td><div class="badge-row">${badges.join("")}</div></td>
          <td class="meta">${e.AnneeEnregistrement ?? "—"}</td>
          <td>
            <div class="row-actions">
              <button class="edit-btn" title="Modifier" aria-label="Modifier"><i class="ti ti-pencil"></i></button>
              ${
                e.Actif
                  ? `<button class="toggle-btn danger" title="Désactiver" aria-label="Désactiver"><i class="ti ti-power"></i></button>`
                  : `<button class="toggle-btn good" title="Activer" aria-label="Activer"><i class="ti ti-rotate-clockwise"></i></button>`
              }
            </div>
          </td>
        </tr>`;
      })
      .join("");

    tbody.querySelectorAll(".edit-btn").forEach((btn) =>
      btn.addEventListener("click", (e) => {
        const id = Number(e.target.closest("tr").dataset.id);
        openEditModal(id);
      })
    );
    tbody.querySelectorAll(".toggle-btn").forEach((btn) =>
      btn.addEventListener("click", (e) => {
        const tr = e.target.closest("tr");
        const id = Number(tr.dataset.id);
        const entreprise = allEntreprises.find((x) => x.IdEntreprise === id);
        if (entreprise) openConfirmToggle(entreprise);
      })
    );
  }

  async function loadEntreprises() {
    document.getElementById("entreprises-tbody").innerHTML =
      `<tr><td colspan="6"><div class="loading-state">Chargement…</div></td></tr>`;
    try {
      allEntreprises = await apiRequest("/entreprises", { headers: authHeaders(false) });
      renderTable();
    } catch (err) {
      document.getElementById("entreprises-tbody").innerHTML =
        `<tr><td colspan="6"><div class="empty-state">Impossible de charger les entreprises.</div></td></tr>`;
      showPageError(err.message);
    }
  }

  document.getElementById("search-input").addEventListener("input", renderTable);
  document.getElementById("status-filter").addEventListener("change", renderTable);

  // ---------- Modal création / édition ----------

  const entrepriseModalOverlay = document.getElementById("entreprise-modal-overlay");
  const entrepriseForm = document.getElementById("entreprise-form");
  const entrepriseModalTitle = document.getElementById("entreprise-modal-title");
  const entrepriseModalBanner = document.getElementById("entreprise-modal-banner");
  const entrepriseSubmitLabel = document.getElementById("entreprise-submit-label");
  const entrepriseSubmitBtn = document.getElementById("entreprise-submit-btn");

  function clearEntrepriseFormErrors() {
    document.getElementById("entreprise-nom-error").classList.remove("visible");
    entrepriseModalBanner.classList.remove("visible");
  }

  function resetEntrepriseForm() {
    entrepriseForm.reset();
    document.getElementById("entreprise-id").value = "";
    clearEntrepriseFormErrors();
  }

  function openCreateModal() {
    resetEntrepriseForm();
    entrepriseModalTitle.textContent = "Nouvelle entreprise";
    entrepriseSubmitLabel.textContent = "Créer";
    entrepriseModalOverlay.classList.add("visible");
    document.getElementById("entreprise-nom").focus();
  }

  function openEditModal(id) {
    const e = allEntreprises.find((x) => x.IdEntreprise === id);
    if (!e) return;
    resetEntrepriseForm();
    entrepriseModalTitle.textContent = "Modifier l'entreprise";
    entrepriseSubmitLabel.textContent = "Enregistrer";
    document.getElementById("entreprise-id").value = e.IdEntreprise;
    document.getElementById("entreprise-nom").value = e.Nom || "";
    document.getElementById("entreprise-responsable").value = e.Responsable || "";
    document.getElementById("entreprise-telephone").value = e.Telephone || "";
    document.getElementById("entreprise-email").value = e.Email || "";
    document.getElementById("entreprise-adresse").value = e.Adresse || "";
    document.getElementById("entreprise-siteweb").value = e.SiteWeb || "";
    document.getElementById("entreprise-facebook").value = e.Facebook || "";
    document.getElementById("entreprise-rccm").value = e.RCCM || "";
    document.getElementById("entreprise-ifu").value = e.IFU || "";
    document.getElementById("entreprise-visite").checked = !!e.Visite;
    document.getElementById("entreprise-valide").checked = !!e.Valide;
    entrepriseModalOverlay.classList.add("visible");
    document.getElementById("entreprise-nom").focus();
  }

  function closeEntrepriseModal() {
    entrepriseModalOverlay.classList.remove("visible");
  }

  document.getElementById("open-create-btn").addEventListener("click", openCreateModal);
  document.getElementById("entreprise-cancel-btn").addEventListener("click", closeEntrepriseModal);
  document.getElementById("entreprise-modal-close").addEventListener("click", closeEntrepriseModal);
  entrepriseModalOverlay.addEventListener("click", (e) => {
    if (e.target === entrepriseModalOverlay) closeEntrepriseModal();
  });

  entrepriseForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearEntrepriseFormErrors();

    const id = document.getElementById("entreprise-id").value;
    const nom = document.getElementById("entreprise-nom").value.trim();

    if (!nom) {
      document.getElementById("entreprise-nom-error").classList.add("visible");
      return;
    }

    const payload = {
      nom,
      responsable: document.getElementById("entreprise-responsable").value.trim() || null,
      telephone: document.getElementById("entreprise-telephone").value.trim() || null,
      email: document.getElementById("entreprise-email").value.trim() || null,
      adresse: document.getElementById("entreprise-adresse").value.trim() || null,
      siteweb: document.getElementById("entreprise-siteweb").value.trim() || null,
      facebook: document.getElementById("entreprise-facebook").value.trim() || null,
      rccm: document.getElementById("entreprise-rccm").value.trim() || null,
      ifu: document.getElementById("entreprise-ifu").value.trim() || null,
      visite: document.getElementById("entreprise-visite").checked,
      valide: document.getElementById("entreprise-valide").checked,
    };

    entrepriseSubmitBtn.disabled = true;
    const originalLabel = entrepriseSubmitLabel.textContent;
    entrepriseSubmitLabel.textContent = id ? "Enregistrement…" : "Création…";

    try {
      if (id) {
        await apiRequest(`/entreprises/${id}`, {
          method: "PUT",
          headers: authHeaders(),
          body: JSON.stringify(payload),
        });
        showPageSuccess("Entreprise modifiée avec succès.");
      } else {
        await apiRequest("/entreprises", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify(payload),
        });
        showPageSuccess("Entreprise créée avec succès.");
      }
      closeEntrepriseModal();
      await loadEntreprises();
    } catch (err) {
      entrepriseModalBanner.textContent = err.message;
      entrepriseModalBanner.classList.add("visible");
    } finally {
      entrepriseSubmitBtn.disabled = false;
      entrepriseSubmitLabel.textContent = originalLabel;
    }
  });

  // ---------- Modal confirmation activer / désactiver ----------

  const confirmModalOverlay = document.getElementById("confirm-modal-overlay");
  const confirmModalTitle = document.getElementById("confirm-modal-title");
  const confirmModalText = document.getElementById("confirm-modal-text");
  const confirmOkBtn = document.getElementById("confirm-ok-btn");

  let pendingToggle = null;

  function openConfirmToggle(entreprise) {
    pendingToggle = entreprise;
    const willActivate = !entreprise.Actif;
    confirmModalTitle.textContent = willActivate ? "Activer l'entreprise" : "Désactiver l'entreprise";
    confirmModalText.textContent = willActivate
      ? `Réactiver « ${entreprise.Nom} » ? Elle réapparaîtra comme partenaire actif.`
      : `Désactiver « ${entreprise.Nom} » ? Elle sera marquée comme inactive.`;
    confirmOkBtn.className = willActivate ? "btn btn-ghost-good" : "btn btn-ghost-danger";
    confirmOkBtn.textContent = willActivate ? "Activer" : "Désactiver";
    confirmModalOverlay.classList.add("visible");
  }

  function closeConfirmModal() {
    confirmModalOverlay.classList.remove("visible");
    pendingToggle = null;
  }

  document.getElementById("confirm-cancel-btn").addEventListener("click", closeConfirmModal);
  document.getElementById("confirm-modal-close").addEventListener("click", closeConfirmModal);
  confirmModalOverlay.addEventListener("click", (e) => {
    if (e.target === confirmModalOverlay) closeConfirmModal();
  });

  confirmOkBtn.addEventListener("click", async () => {
    if (!pendingToggle) return;
    const willActivate = !pendingToggle.Actif;
    const id = pendingToggle.IdEntreprise;
    const nom = pendingToggle.Nom;

    confirmOkBtn.disabled = true;
    try {
      await apiRequest(`/entreprises/${id}/${willActivate ? "activer" : "desactiver"}`, {
        method: "PATCH",
        headers: authHeaders(),
      });
      closeConfirmModal();
      showPageSuccess(willActivate ? `« ${nom} » a été activée.` : `« ${nom} » a été désactivée.`);
      await loadEntreprises();
    } catch (err) {
      closeConfirmModal();
      showPageError(err.message);
    } finally {
      confirmOkBtn.disabled = false;
    }
  });

  // ---------- Init ----------

  loadEntreprises();
</script>

</body>
</html>
